name: Tests

# Two tiers (docs/roadmap.md, step 2; docs/test-history.md):
#   gate    every pull request and push: the routine suite held to a five-minute budget. Benchmarks do not run here.
#   nightly the full default suite including every benchmark floor, with proof verdicts cached by prover source.
#   docs-index nightly: lists any docs page or results file no index names (tools/docs_index.py) in a pull request.
# GitHub Actions must be enabled for the repository for either job to run.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  gate:
    name: gate (routine tier, 5 minute budget)
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,smt]" "sqlglotc==30.21.0" --only-binary sqlglotc
      - name: Run the gate
        # Fails when the run takes longer than 300 seconds, so the gate cannot grow back unnoticed.
        run: python tools/run_tests.py --gate --label "gate ${{ github.sha }}"

  nightly:
    name: nightly (full suite and benchmark floors)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,smt]" "sqlglotc==30.21.0" --only-binary sqlglotc
      - name: Restore proof verdicts
        # Keys hold a hash of the prover's source, so a prover change misses for every pair; a stale cache is harmless.
        uses: actions/cache@v4
        with:
          path: .verdict-cache
          key: verdicts-${{ hashFiles('pyproject.toml') }}  # the prover is a pinned dependency now; the keys inside hold its source hash
          restore-keys: verdicts-
      - name: Run the full suite
        id: full
        run: python tools/run_tests.py --verdict-cache .verdict-cache --label "nightly ${{ github.sha }}"
      - name: Open an issue when a benchmark floor or test fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Nightly run failed on ${GITHUB_SHA::8}" \
            --label nightly \
            --body "The nightly full run failed (benchmark floor or test). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            || gh issue create --title "Nightly run failed on ${GITHUB_SHA::8}" --body "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  docs-index:
    name: refresh the docs indexes
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Add pages and results files no index names to the generated blocks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/docs_index.py --write
          if ! git diff --quiet; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git checkout -B docs-index-refresh
            git commit -am "Refresh the generated docs index blocks"
            git push --force origin docs-index-refresh
            gh pr create --base "${GITHUB_REF_NAME}" --head docs-index-refresh \
              --title "Refresh the generated docs index blocks" \
              --body "Pages or results files that no index named, added by tools/docs_index.py. Move a line above the generated block to place it by hand." || true
          fi
